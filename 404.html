*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--mist);color:var(--ink);font-family:var(--f-body);line-height:1.7;padding:32px}

nav{display:flex;flex-wrap:wrap;gap:12px}
a{display:inline-flex;align-items:center;min-height:48px;padding:10px 20px;border:1px solid var(--line);border-radius:999px;color:var(--forest);text-decoration:none;font-weight:500;transition:background-color .3s cubic-bezier(.22,1,.36,1),border-color .3s cubic-bezier(.22,1,.36,1),transform .3s cubic-bezier(.22,1,.36,1)}
a:hover{background:#E9F3EE;border-color:var(--leaf);transform:translateY(-1px)}
a:active{transform:translateY(1px)}
a.primary{background:var(--forest);border-color:var(--forest);color:#fff}
a.primary:hover{background:#0A3A2B}
a:focus-visible{outline:3px solid var(--forest);outline-offset:3px}
@media (prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
</style>
