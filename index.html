:root{

button,input,textarea{font:inherit;color:inherit}
a{color:var(--forest)}
:focus-visible{outline:2.5px solid var(--leaf);outline-offset:2px}
.container{max-width:1080px;margin:0 auto;padding-inline:20px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .container{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* home */
.hero{padding-block:64px 56px;border-bottom:1px solid var(--line)}
.hero .container{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:center}

/* check */
.prog{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin:18px 0 8px}

.opts{display:grid;gap:10px;margin-top:26px}
.opt{position:relative}

.opt span{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer;background:var(--white);font-size:16px}
.opt span::before{content:"";width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:50%;flex:none;background:var(--white)}
.opt input[type=checkbox]+span::before{border-radius:4px}
.opt span:hover{border-color:var(--leaf)}
.opt input:checked+span{border-color:var(--forest);background:var(--mint);color:var(--forest);font-weight:500}
.opt input:checked+span::before{background:var(--forest);border-color:var(--forest);box-shadow:inset 0 0 0 3px var(--mint)}
.opt input:focus-visible+span{outline:2.5px solid var(--leaf);outline-offset:2px}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px;flex-wrap:wrap}
.err{color:var(--high);font-size:14px}

/* report */
.rep-card{border:1px solid var(--line);border-radius:16px;padding:28px;position:relative;overflow:hidden;background:var(--white)}
.rep-card .wm{position:absolute;right:-24px;top:-20px;width:170px;opacity:.05;pointer-events:none}
.rep-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:12px}
.rep-top{display:flex;align-items:center;gap:26px;padding-top:22px;flex-wrap:wrap}

.stamp .big{font-size:28px;display:block;letter-spacing:.05em}
.stamp .sm{font-family:var(--f-mono);font-size:11px;display:block;letter-spacing:.2em}
.stamp.high{color:var(--high)} .stamp.mid{color:var(--mid)} .stamp.low{color:var(--low)}
@media (prefers-reduced-motion:no-preference){.stamp.pop{animation:pop .4s ease-out}}
@keyframes pop{0%{transform:rotate(-6deg) scale(1.3);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:1}}
.pill{font-family:var(--f-mono);font-size:11.5px;padding:2px 10px;border-radius:999px;white-space:nowrap}

.rsec{margin-top:40px}
.rsec>h2{font-size:22px;margin-bottom:14px}
ol.todo{margin:0;padding:0;list-style:none;display:grid;gap:14px;counter-reset:t}
ol.todo li{counter-increment:t;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
ol.todo li::before{content:counter(t);width:28px;height:28px;border-radius:50%;background:var(--forest);color:var(--white);display:grid;place-items:center;font-size:13px;font-family:var(--f-mono);margin-top:1px}
ol.todo li p{margin:0}
.cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cite{font-family:var(--f-mono);font-size:11.5px;color:var(--forest);background:var(--mist);border:1px solid var(--line);border-radius:6px;padding:1px 8px;text-decoration:none;white-space:nowrap}
.cite:hover{border-color:var(--leaf)}

.mkt-body{padding:0 20px 18px;display:grid;gap:14px}
.rule{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.rule .rt{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rule .rt b{font-size:16px}

.rule p{margin:0;font-size:15px}
.rule .need{font-size:14px;background:var(--mist);border-radius:8px;padding:8px 12px}
.rule .more{font-size:14px}
.why{border-left:2px solid var(--gold);padding:2px 0 2px 12px}
.why .why-h{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}

.why li{margin:2px 0}

@media (max-width:600px){dl.answers{grid-template-columns:minmax(0,1fr)} dl.answers dd{margin-bottom:8px}}
.reply{background:var(--mist);border:1px solid var(--line);border-radius:10px;padding:16px;font-family:var(--f-mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin-top:12px}
details.plain{border:1px solid var(--line);border-radius:12px;padding:0 20px}

details.plain[open]{padding-bottom:18px}
ol.refs{margin:0;padding-left:1.6em;display:grid;gap:8px;font-size:14px}
ol.refs li::marker{font-family:var(--f-mono);color:var(--muted)}
ol.refs .ref{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.empty{border:1px dashed var(--line-2);border-radius:14px;padding:36px;text-align:center;display:grid;gap:14px;justify-items:center}

/* rules library */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filters button{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:5px 15px;cursor:pointer;font-size:14px}

.lib{display:grid;gap:0;border-top:1px solid var(--line)}

.dsec{margin-bottom:28px}

.dsec p{margin:0}
.aside{border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;position:sticky;top:80px}

.dec{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}

.tq{border-top:1px solid var(--line);padding-block:16px;display:grid;grid-template-columns:2em minmax(0,1fr);gap:2px 12px}
.tq:first-child{border-top:0;padding-top:0}

.stag{font-family:var(--f-mono);font-size:11px;padding:2px 9px;border-radius:6px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:var(--white);display:inline-block}
.stag.inforce{border-color:var(--forest);color:var(--forest);background:var(--mint)}

    [{zh:"谁在做",en:"Who is building it"},{zh:["青单由 Zach 发起。他做过上市公司 ESG 报告的数据收集与核验、银行绿色金融产品推广和外贸单证工作，这个工具连接的正是这三块。"],en:["Qingdan was started by Zach, who has worked on ESG data verification for a listed company's sustainability report, green-finance products at a bank, and export documentation, the three pieces this tool connects."]}],

const L = (zh,en)=>({zh,en});
const cbamIn = a => has(a.product,"cement") || (a.hs||[]).some(h=>CBAM_HS_IN.includes(h));
const cbamMaybe = a => (a.hs||[]).includes("hunk");
const fuelUsed = a => a.role!=="trader" && (a.fuel||[]).some(f=>f!=="nofuel");
const dataLines = a => {
  const out=[];
  if(a.role==="trader") out.push(L("你是贸易公司：排放数据需要向供货工厂索取","You are a trader: emissions data must come from your supplying factories"));
  else {
    out.push(L("用电记录："+ansText("elec",a),"Electricity records: "+ansText("elec",a)));
    if(fuelUsed(a)) out.push(L("燃料记录："+ansText("fueldata",a),"Fuel records: "+ansText("fueldata",a)));
  }
  if(a.origin) out.push(L("原料来源："+ansText("origin",a),"Raw-material origin: "+ansText("origin",a)));
  return out;
};
const cbamDataOK = a => a.role==="trader" ? a.origin==="proof" : (a.elec==="monthly" && (!fuelUsed(a) || a.fueldata==="monthly") && a.origin==="proof");

RULE.cbam.applies = a => {
  if(!cbamIn(a) && !cbamMaybe(a)) return null;
  if(a.volume==="v0") return "mid";
  if(!cbamIn(a)) return "mid";
  return cbamDataOK(a) ? "mid" : "high";
};
RULE.cbam.why = a => {
  const w=[];
  if(has(a.product,"cement")) w.push(L("水泥 / 化肥在 CBAM 附件一范围内","Cement/fertiliser is listed in CBAM Annex I"));
  const inHs=(a.hs||[]).filter(h=>CBAM_HS_IN.includes(h));
  if(inHs.length) w.push(L("海关编码在 CBAM 附件一范围内："+inHs.map(h=>optLabel("hs",h).split("：")[0]).join("、"),"HS codes listed in CBAM Annex I: "+inHs.map(h=>optLabel("hs",h).split(":")[0]).join(", ")));
  if(cbamMaybe(a)) w.push(L("海关编码不确定，需要对照附件一核实","HS code unknown; check it against Annex I"));
  if(a.volume==="v0") w.push(L("年出口低于 50 吨：如果客户全年的 CBAM 进口总量也低于 50 吨，可以豁免","Under 50 t a year: exempt if your buyer's total CBAM imports are also under 50 t"));
  else if(a.volume==="v1"||a.volume==="v2") w.push(L("年出口量高于 50 吨豁免门槛","Annual volume above the 50 t exemption"));
  else if(a.volume==="vunk") w.push(L("出口量不清楚，按需要申报处理","Volume unknown; treated as in scope"));
  return w.concat(dataLines(a));

function assess(raw){
  const a = cleanAnswers(raw);
  const perMarket = (a.market||[]).map(m=>{
    const hits = RULES.filter(r=>r.mkt===m).map(r=>({r,lv:r.applies(a)})).filter(x=>x.lv).sort((x,y)=>RANK[y.lv]-RANK[x.lv]);
    const top = hits.reduce((mx,x)=>Math.max(mx,RANK[x.lv]),1);
    return {m, lv:BY[top], hits};
  }).sort((x,y)=>RANK[y.lv]-RANK[x.lv]);
  let lvl = perMarket.reduce((mx,p)=>Math.max(mx,RANK[p.lv]),1);
  // data gap: what the rules ask for vs what you hold
  let gap = (a.elec==="none"?2:a.elec==="total"?1:0);
  if(fuelUsed(a)) gap += a.fueldata==="none"?2:a.fueldata==="total"?1:(a.fueldata?0:1);
  if(a.origin) gap += a.origin==="none"?2:a.origin==="rough"?1:0;
  if(a.cert && a.cert!=="none") gap -= 1;
  const buyerHits = RULES.filter(r=>r.mkt==="buyer").map(r=>({r,lv:r.applies(a)})).filter(x=>x.lv).sort((x,y)=>RANK[y.lv]-RANK[x.lv]);
  lvl = Math.max(lvl, buyerHits.reduce((mx,x)=>Math.max(mx,RANK[x.lv]),1));
  const DATA_RULES = ["cbam","ukcbam","eudr","scope3","battery"];
  const realMid = perMarket.some(p=>p.hits.some(h=>h.lv==="mid" && DATA_RULES.includes(h.r.id) && !(h.r.id==="cbam"&&a.volume==="v0")));
  const bumped = gap>=3 && lvl===2 && realMid;
  if(bumped) lvl=3;
  const ids = new Set(perMarket.flatMap(p=>p.hits.map(h=>h.r.id)));
  const pressured = a.buyer==="brand"||a.survey==="many"||a.survey==="once";
  const todo = [];
  if(cbamMaybe(a) && (ids.has("cbam")||ids.has("ukcbam"))) todo.push({t:L("找报关行确认产品海关编码的前 4 位。CBAM 管不管你，以条例附件一列出的编码为准。","Ask your customs broker for the first four HS digits. CBAM scope follows the codes in Annex I."), b:["cbam"], w:"customs"});
  if(a.role==="trader" && (ids.has("cbam")||ids.has("ukcbam"))) todo.push({t:L("向每家供货工厂索取生产设施的排放数据和工艺说明。CBAM 要的是生产设施的实际数据，贸易商自己算不出来。","Ask each supplying factory for installation-level emissions data and a process description. CBAM needs the producer's actual data."), b:["cbam"], w:"supplier"});
  if(a.role!=="trader" && a.elec!=="monthly") todo.push({t:L("把过去 12 个月的电费单按月整理成一张表，用生态环境部公布的 2023 年全国电网排放因子（0.5306 kgCO₂/kWh）换算出范围 2 排放。","Put 12 months of power bills into a monthly table and convert with China's official 2023 grid factor (0.5306 kgCO₂/kWh) to get Scope 2."), b:["gri302","ghg","mee"], w:"self"});
  if(fuelUsed(a) && a.fueldata!=="monthly") todo.push({t:L("把天然气、柴油、煤的采购发票按月汇总。直接燃烧属于范围 1，往往是铸造、热处理类工厂的最大排放源。","Total gas, diesel and coal purchase invoices by month. Direct combustion is Scope 1, often the largest source for foundries and heat treatment."), b:["ghg","gri305"], w:"self"});
  if(a.role!=="trader" && (ids.has("cbam")||ids.has("ukcbam")) && a.origin!=="proof") todo.push({t:L("向钢 / 铝原料供应商要钢厂 / 铝厂名称和排放数据。CBAM 计算包括原料（前体）的排放。","Ask your steel/aluminium suppliers for mill names and emissions data. CBAM includes precursor emissions."), b:["cbam","cbam25"], w:"supplier"});
  if(ids.has("eudr") && a.origin!=="proof") todo.push({t:L("列出木材、橡胶、皮革或农产品原料的上游供应商和产地，索取原产地证明和地块信息。","List upstream suppliers and origins for wood, rubber, leather or agri inputs and request proof of origin and plot data."), b:["eudr","eudr25"], w:"supplier"});
  if(ids.has("battery")) todo.push({t:L("把每个电池型号的电芯供应商和成分整理成一页，为电池护照做准备。","Put cell suppliers and composition for each battery model on one page, ready for the battery passport."), b:["bat"], w:"supplier"});
  if(ids.has("cbam") && a.volume==="v0") todo.push({t:L("问客户：你们全年的 CBAM 商品进口总量是否超过 50 吨？超过的话，仍需要你的排放数据。","Ask your buyer whether their total CBAM imports exceed 50 tonnes a year. If so, they still need your data."), b:["cbam25"], w:"buyerq"});
  if(pressured && a.size && a.size!=="xl" && (a.market||[]).includes("eu")) todo.push({t:L("回复欧洲客户时写明工厂人数，并问清哪些题是必答的。员工不超过 1000 人的供应商，可以拒绝提供自愿标准（VSME）以外的信息。","Tell EU buyers your headcount and ask which questions are mandatory. Suppliers with up to 1,000 staff may decline requests beyond VSME."), b:["omni","vsme"], w:"buyerq"});
  if(pressured) todo.push({t:L("先答问卷里的三类基础题：能源消耗、范围 1 和 2 排放、环保政策。其余写明正在准备。","Answer the three basics first: energy use, Scope 1–2 emissions, environmental policy. Mark the rest in progress."), b:["gri302","gri305","gri2"], w:"self"});
  if(buyerHits.some(h=>["smeta","bsci"].includes(h.r.id))) todo.push({t:L("审核前先自查工时、工资、消防安全和环保许可记录，这是社会责任审核最常扣分的地方。","Before the audit, self-check working hours, pay, fire safety and environmental permits, the most common audit findings."), b:buyerHits.filter(h=>["smeta","bsci"].includes(h.r.id)).map(h=>h.r.id), w:"auditor"});
  if(ids.has("ppwr")) todo.push({t:L("列出每款产品的包装材质，向包装供应商索取符合 PPWR 的符合性声明。","List packaging materials for each product and ask packaging suppliers for PPWR declarations of conformity."), b:["ppwr"], w:"supplier"});
  todo.push({t:L("主动问一句你的主要客户：明年需要我们提供哪些环境数据？","Ask your main buyer directly: what environmental data will you need from us next year?"), b:[], w:"buyerq"});
  return {a, level:BY[lvl], bumped, gap, perMarket, buyerHits, todo:todo.slice(0,3)};
}


function buyerReply(a){
  const sizeTxt = {s:"under 50",m:"50–300",l:"300–1,000",xl:"over 1,000"}[a.size] || "[number of]";
  const prodMap = {steel:"steel and aluminium products",cement:"cement and fertiliser products",machine:"machinery and appliances",wood:"wood products and furniture",rubber:"rubber and leather goods",battery:"batteries and battery-powered products",textile:"textiles and apparel",otherp:"industrial products"};
  const mktMap = {eu:"the EU",uk:"the UK",us:"the US",me:"the Middle East",sea:"Southeast Asia",other:"other markets"};
  const join = x => x.length<=1 ? (x[0]||"") : x.slice(0,-1).join(", ")+" and "+x[x.length-1];
  const prods=(a.product||[]).map(p=>prodMap[p]).filter(Boolean), mkts=(a.market||[]).map(m=>mktMap[m]).filter(Boolean);
  const energy = a.elec==="monthly" ? "Our monthly electricity data for the past 12 months (GRI 302-1) is ready to share, together with Scope 2 emissions calculated under the GHG Protocol."
    : a.elec==="total" ? "We are breaking our annual electricity total into monthly figures (GRI 302-1) and will calculate Scope 2 emissions under the GHG Protocol."
    : "We are compiling 12 months of electricity data from our utility bills (GRI 302-1) and will calculate Scope 2 emissions under the GHG Protocol.";
  const origin = a.origin==="proof" ? "We can document the origin of our main raw materials." : "We are confirming mill and origin details with our raw-material suppliers.";
  const small = a.size && a.size!=="xl";
  return "Dear [Buyer name],\n\nThank you for your sustainability request. We are a manufacturer of "+(join(prods)||"[products]")+" with "+sizeTxt+" employees, exporting to "+(join(mkts)||"[markets]")+".\n\n"+energy+" "+origin+" We expect to send the first data set by [date].\n\n"
    +(small?"As a supplier with fewer than 1,000 employees, we would appreciate knowing which questions are mandatory for your reporting so we can prioritise them.\n\n":"Please let us know which questions are mandatory for your reporting so we can prioritise them.\n\n")
    +"Best regards,\n[Name], [Factory]";
}

function el(tag,cls,txt){const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e;}

function legacyCopy(text){
  try{
    const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;left:-9999px;top:0;opacity:0";
    document.body.append(ta); ta.select(); ta.setSelectionRange(0,text.length);
    const ok=document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}
function copyTo(btn,msg,getText,selEl,okText){
  btn.addEventListener("click",()=>{
    const text=getText();
    const ok=()=>{msg.textContent=okText||T(S.copied);};
    const fail=()=>{
      if(legacyCopy(text)){ ok(); return; }
      msg.textContent=T(S.copyBlocked);
      if(selEl){ const s=getSelection(), r=document.createRange(); r.selectNodeContents(selEl); s.removeAllRanges(); s.addRange(r); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok,fail); }
    else fail();
  });
}
function downloadText(name,text){
  try{
    const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=name; a.style.display="none";
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); return true;
  }catch(e){ return false; }
}

/* Citation numbering is shared by the on-screen report and the exported text, so that
   "[3]" means the same document in both. Registration order: to-dos, then markets, then buyer standards. */
function citeOrder(r){
  const order=[];
  const num=id=>{ let i=order.indexOf(id); if(i<0){order.push(id); i=order.length-1;} return i+1; };
  r.todo.forEach(t=>t.b.forEach(num));
  r.perMarket.forEach(p=>p.hits.forEach(h=>h.r.basis.forEach(num)));
  r.buyerHits.forEach(h=>h.r.basis.forEach(num));
  return {order,num};
}

function materialRows(r){
  const seen=new Set(), out=[];
  const push=(h)=>{ const t=T(h.r.need); if(seen.has(t)) return; seen.add(t);
    out.push({t, rule:T(h.r.t), b:h.r.basis}); };
  r.perMarket.forEach(p=>p.hits.forEach(push));
  r.buyerHits.forEach(push);

  L.push(zh?"青单 Qingdan · 订单风险检查单":"Qingdan · Order risk report");
  L.push((zh?"参考编号 ":"Reference ")+ref+(zh?" · 生成于 ":" · generated ")+new Date().toISOString().slice(0,10));
  if(opts.sample) L.push(zh?"（样例：山东一家 120 人的钢制紧固件工厂，内容为虚构）":"(Sample: a fictional 120-person steel fastener factory in Shandong)");
  L.push("");
  L.push((zh?"结论：":"Verdict: ")+T(S.lvl[r.level])+" / "+S.lvlEn[r.level]);
  L.push(T(S.verdict[r.level]));
  if(r.bumped) L.push(T(S.bumpNote));
  L.push("");
  L.push(zh?"你的情况":"Your situation");
  L.push((zh?"  产品：" : "  Products: ")+ansText("product",r.a));
  L.push((zh?"  出口市场：" : "  Export markets: ")+ansText("market",r.a));
  profileRows(r.a).forEach(x=>L.push("  "+x.label+(zh?"：":" : ")+x.value));
  L.push("");
  L.push(zh?"一、本周先做的 3 件事":"1. Three things to do this week");
  r.todo.forEach((t,i)=>{
    const who = t.w ? (zh?"【"+T(WHO[t.w])+"】":"["+T(WHO[t.w])+"] ") : "";
    L.push((i+1)+". "+who+T(t.t));
    if(t.b.length) L.push((zh?"   依据：":"   Source: ")+cite(t.b));
  });
  L.push("");
  L.push(zh?"二、按出口市场":"2. By export market");
  r.perMarket.forEach(p=>{
    const direct=p.hits.filter(h=>h.r.status!=="indirect"), indirect=p.hits.filter(h=>h.r.status==="indirect");
    L.push("【"+T(MARKET[p.m])+"】"+T(S.lvl[p.lv]));
    if(direct.length){
      L.push(zh?"  直接约束你：":"  Binds you directly:");
      direct.forEach(h=>{
        L.push("  · "+T(h.r.t)+"（"+T(STATUS[h.r.status])+"）");
        L.push("    时间："+T(h.r.when));
        L.push("    "+T(S.asksYou)+"："+T(h.r.need));
        L.push("    依据："+cite(h.r.basis));
      });
    } else L.push("  "+T(S.noDirectP));
    if(indirect.length){
      L.push(zh?"  间接影响（约束的是你的客户）：":"  Indirect (binds your buyers):");
      indirect.forEach(h=>{
        L.push("  · "+T(h.r.t)+"（"+T(STATUS[h.r.status])+"）");
        L.push("    "+T(S.asksYou)+"："+T(h.r.need));
        L.push("    依据："+cite(h.r.basis));
      });
    }
  });
  L.push("");
  if(r.buyerHits.length){
    L.push(zh?"三、买家审核要求（不是法律，但决定能否接单）":"3. Buyer audit requirements (not law, but they decide orders)");
    r.buyerHits.forEach(h=>{
      L.push("  · "+T(h.r.t));
      L.push("    "+T(S.asksYou)+"："+T(h.r.need));
      L.push("    依据："+cite(h.r.basis));
    });
    L.push("");
  }
  const mats=materialRows(r);
  if(mats.length){
    L.push(zh?"四、客户会找你要这些材料":"4. Documents your buyer will ask for");
    mats.forEach(m=>L.push("  □ "+m.t+(zh?"　[":"  [")+m.rule+"] "+cite(m.b)));
    L.push("");
  }
  L.push(zh?"五、可以直接发给客户的英文回复（方括号里的内容换成你自己的）":"5. English reply you can send (replace the bracketed parts)");
  buyerReply(r.a).split("\n").forEach(x=>L.push("  "+x));
  L.push("");
  L.push(zh?"六、本报告依据":"6. Sources");
  const endsDot = t=>/[。.!？?；;]$/.test(t);
  order.forEach(id=>{
    const s=SRC[id]; if(!s) return;
    L.push("["+num(id)+"] "+s.ref+" — "+T(s.t)+(endsDot(T(s.t))?" ":"。 ")+T(s.by)+(endsDot(T(s.by))?" ":"。 "));
    L.push("    "+s.url);
  });
  L.push("");
  L.push(zh?"说明：":"Note: ");
  L.push("  "+T(S.repNote));
  L.push("  "+(zh?"依据与方法：":"Sources & method: ")+"https://zachclaude.github.io/greenledger/#method");
  return L.join("\n");
}

/* ============ carbon data calculator ============ */
// Default factors: MEE《企业温室气体排放核算与报告指南 发电设施》(2026) Appendix A —
// LHV × carbon content per GJ × oxidation rate × 44/12. Same defaults as the NDRC 2015 industry guides.
const FUELS = [
  {id:"gas", unit:{zh:"立方米",en:"m³"}, lab:{zh:"天然气",en:"Natural gas"}, lhv:389.31/10000, cc:0.01532, ox:0.99, lhvTxt:"389.31 GJ/10⁴Nm³"},
  {id:"diesel", unit:{zh:"吨",en:"t"}, lab:{zh:"柴油",en:"Diesel"}, lhv:42.652, cc:0.0202, ox:0.98, lhvTxt:"42.652 GJ/t"},
  {id:"gasoline", unit:{zh:"吨",en:"t"}, lab:{zh:"汽油",en:"Gasoline"}, lhv:43.070, cc:0.0189, ox:0.98, lhvTxt:"43.070 GJ/t"},
  {id:"lpg", unit:{zh:"吨",en:"t"}, lab:{zh:"液化石油气",en:"LPG"}, lhv:50.179, cc:0.0172, ox:0.98, lhvTxt:"50.179 GJ/t"}
];
FUELS.forEach(f=>{ f.ef = f.lhv*f.cc*f.ox*44/12; }); // tCO2 per unit
const GRID_EF = 0.5306; // kgCO2/kWh, MEE & NBS 2023 national average
const MONTHS = {zh:["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"],en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]};
const CALC_EXAMPLE = {kwh:[82000,61000,88000,90000,93000,97000,101000,99000,94000,92000,89000,86000], green:0, gas:46000, diesel:6.5, gasoline:0, lpg:0, output:1850, name:"示例紧固件厂"};
let calc = JSON.parse(JSON.stringify(CALC_EXAMPLE)); let calcIsExample = true;
const fmt = (n,d=1)=> isFinite(n) ? n.toLocaleString(lang==="zh"?"zh-CN":"en-GB",{minimumFractionDigits:d,maximumFractionDigits:d}) : "—";
function calcResult(c){
  const kwh = c.kwh.reduce((s,x)=>s+(+x||0),0);
  const green = Math.min(+c.green||0, kwh);
  const s2 = kwh*GRID_EF/1000; // location-based tCO2
  const fuels = FUELS.map(f=>{ const q=+c[f.id]||0; return {f, q, t:q*f.ef, gj:q*f.lhv}; });
  const s1 = fuels.reduce((s,x)=>s+x.t,0);
  const elecGJ = kwh*0.0036;
  const gj = elecGJ + fuels.reduce((s,x)=>s+x.gj,0);
  const out = +c.output||0;
  return {kwh, green, s1, s2, total:s1+s2, fuels, elecGJ, gj, out, intensity: out? (s1+s2)/out : NaN, share: kwh? green/kwh*100 : 0};
}
function dataSheet(c,r){
  const L1 = lang==="zh";
  const lines = [];

  r.fuels.filter(x=>x.q).forEach(x=>lines.push("  "+T(x.f.lab)+": "+fmt(x.q,x.f.id==="gas"?0:1)+" "+T(x.f.unit)+" ("+fmt(x.gj,0)+" GJ)"));
  lines.push((L1?"GRI 305-1 范围 1 直接排放：":"GRI 305-1 Scope 1 direct emissions: ")+fmt(r.s1,1)+" tCO₂e");
  lines.push((L1?"GRI 305-2 范围 2 能源间接排放（基于位置）：":"GRI 305-2 Scope 2 energy indirect emissions (location-based): ")+fmt(r.s2,1)+" tCO₂e");
  lines.push((L1?"范围 1 + 2 合计：":"Scope 1 + 2 total: ")+fmt(r.total,1)+" tCO₂e");
  if(r.out) lines.push((L1?"排放强度：":"Emissions intensity: ")+fmt(r.intensity,3)+" tCO₂e / "+(L1?"吨产品":"t product")+(L1?"（产量 ":" (output ")+fmt(r.out,0)+(L1?" 吨）":" t)"));
  lines.push("");
  lines.push(L1?"方法说明：按 GHG Protocol 企业标准核算，运营控制法。范围 2 采用生态环境部、国家统计局公布的 2023 年全国电力平均排放因子 0.5306 kgCO₂/kWh；燃料排放采用生态环境部核算指南附录 A 的缺省低位发热量、单位热值含碳量和碳氧化率。仅含二氧化碳，未经第三方核查。"
                :"Method: GHG Protocol Corporate Standard, operational control. Scope 2 uses China's official 2023 national grid factor (0.5306 kgCO₂/kWh, MEE & NBS). Fuel emissions use the default net calorific values, carbon content and oxidation rates in Appendix A of the MEE accounting guideline. CO₂ only; not third-party verified.");
  return lines.join("\n");
}
function viewCalc(){
  const wrap = el("div","container page");
  wrap.append(pageHead(T(S.navCalc),T(S.calcH),T(S.calcP)));
  const grid = el("div","calc");
  // inputs
  const form = el("div","panel calc-in"); form.style.minWidth="0";
  const fh = el("div","panel-h"); const eb = el("span","badge",calcIsExample?T(S.calcExample):T(S.calcYours)); fh.append(el("b",null,T(S.calcIn)), eb); form.append(fh);
  const rerender = ()=>{ calcIsExample=false; eb.textContent=T(S.calcYours); drawOut(); };
  const num = (id,val,step)=>{ const i=document.createElement("input"); i.type="number"; i.min="0"; i.step=step||"any"; i.inputMode="decimal"; i.id=id; i.value=val; return i; };
  form.append(el("div","calc-sec",T(S.calcElec)));
  const mg = el("div","months");
  calc.kwh.forEach((v,k)=>{ const f=el("label","mf"); f.append(el("span",null,MONTHS[lang][k])); const i=num("kwh-"+k,v,"1"); i.addEventListener("input",()=>{calc.kwh[k]=+i.value||0; rerender();}); f.append(i); mg.append(f); });
  form.append(mg);
  const gl = el("label","fld"); gl.append(el("span",null,T(S.calcGreen))); const gi=num("green",calc.green,"1"); gi.addEventListener("input",()=>{calc.green=+gi.value||0; rerender();}); gl.append(gi); form.append(gl);
  form.append(el("p","fine",T(S.calcGreenNote)));
  form.append(el("div","calc-sec",T(S.calcFuel)));
  FUELS.forEach(f=>{ const l=el("label","fld"); l.append(el("span",null,T(f.lab)+(lang==="zh"?"（"+T(f.unit)+"/年）":" ("+T(f.unit)+"/yr)"))); const i=num("f-"+f.id,calc[f.id]); i.addEventListener("input",()=>{calc[f.id]=+i.value||0; rerender();}); l.append(i); form.append(l); });
  form.append(el("p","fine",T(S.calcCoal)));
  form.append(el("div","calc-sec",T(S.calcOut)));
  const ol = el("label","fld"); ol.append(el("span",null,T(S.calcOutL))); const oi=num("output",calc.output,"1"); oi.addEventListener("input",()=>{calc.output=+oi.value||0; rerender();}); ol.append(oi); form.append(ol);
  const br = el("div","row"); br.style.marginTop="12px";
  const clr = el("button","btn small",T(S.calcClear)); clr.type="button"; clr.addEventListener("click",()=>{ calc={kwh:Array(12).fill(0),green:0,gas:0,diesel:0,gasoline:0,lpg:0,output:0}; calcIsExample=false; render(); });
  const ex = el("button","btn small",T(S.calcLoad)); ex.type="button"; ex.addEventListener("click",()=>{ calc=JSON.parse(JSON.stringify(CALC_EXAMPLE)); calcIsExample=true; render(); });
  br.append(clr,ex); form.append(br);
  // outputs
  const out = el("div"); out.style.minWidth="0";
  function drawOut(){
    out.innerHTML="";
    const r = calcResult(calc);
    const tiles = el("div","tiles");
    [[T(S.tS1),r.s1,"tCO₂e","GRI 305-1"],[T(S.tS2),r.s2,"tCO₂e","GRI 305-2"],[T(S.tTot),r.total,"tCO₂e","GHG Protocol"],[T(S.tInt),r.intensity,"tCO₂e/t",lang==="zh"?"每吨产品":"per tonne"]].forEach(([l,v,u,c],i)=>{
      const t=el("div","tile"+(i===2?" main":"")); t.append(el("span","tl",l), el("b",null,fmt(v,i===3?3:1)), el("span","tu",u+" · "+c)); tiles.append(t); });
    out.append(tiles);
    // How to read the numbers: boundary, factor, exclusions, and the use limits — next to the figures, not buried.
    const rd = el("div","why"); rd.style.marginTop="16px";
    rd.append(el("span","why-h",T(S.calcReadH)));
    const ul1=el("ul"); T(S.calcRead).forEach(x=>ul1.append(el("li",null,x))); rd.append(ul1);
    const h2=el("span","why-h",T(S.calcLimitsH)); h2.style.display="block"; h2.style.marginTop="12px"; rd.append(h2);
    const ul2=el("ul"); T(S.calcLimits).forEach(x=>ul2.append(el("li",null,x))); rd.append(ul2);
    out.append(rd);
    // breakdown bar
    const parts = [{l:T(S.calcElecShort),v:r.s2}].concat(r.fuels.filter(x=>x.t>0).map(x=>({l:T(x.f.lab),v:x.t})));
    const tot = parts.reduce((s,x)=>s+x.v,0);
    if(tot>0){
      const bk = el("div","bk"); bk.append(el("div","bk-h",T(S.calcSplit)));
      const bar = el("div","bar2"); const leg = el("div","leg");
      parts.forEach((p,i)=>{ const seg=el("i"); seg.style.width=(p.v/tot*100)+"%"; seg.className="c"+i; bar.append(seg); const lg=el("span"); const dot=el("i","c"+i); lg.append(dot, document.createTextNode(p.l+" "+fmt(p.v/tot*100,0)+"%")); leg.append(lg); });
      bk.append(bar,leg); out.append(bk);
    }
    // factor table
    const ft = el("details","plain"); ft.style.marginTop="16px"; ft.append(el("summary",null,T(S.calcFactors)));
    const tw=el("div","tablewrap"); const tb=el("table","score"); const th=el("thead"); const tr=el("tr"); [T(S.fcItem),T(S.fcQty),T(S.fcFactor),"tCO₂e"].forEach(x=>tr.append(el("th",null,x))); th.append(tr); tb.append(th);
    const tbd=el("tbody");
    const row=(a,b,c2,d)=>{ const r2=el("tr"); [a,b,c2,d].forEach(x=>r2.append(el("td",null,x))); tbd.append(r2); };
    row(T(S.calcElecShort), fmt(r.kwh,0)+" kWh", "0.5306 kgCO₂/kWh", fmt(r.s2,1));
    r.fuels.forEach(x=>row(T(x.f.lab), fmt(x.q,x.f.id==="gas"?0:2)+" "+T(x.f.unit), x.f.lhvTxt+" × "+x.f.cc+" tC/GJ × "+Math.round(x.f.ox*100)+"% × 44/12 = "+(x.f.id==="gas"?fmt(x.f.ef*1000,3)+" kgCO₂/m³":fmt(x.f.ef,3)+" tCO₂/t"), fmt(x.t,1)));
    tb.append(tbd); tw.append(tb); ft.append(tw);
    const fc=el("div","cites"); ["mee","meeguide","ghg"].forEach(id=>fc.append(ext(SRC[id].url,"cite",SRC[id].ref+" ↗"))); ft.append(fc);
    out.append(ft);
    // data sheet
    const ds = el("div","rsec"); ds.style.marginTop="22px"; ds.append(el("h2",null,T(S.calcSheet))); ds.append(el("p","muted",T(S.calcSheetP)));
    const txt = dataSheet(calc,r); const pre=el("div","reply",txt); ds.append(pre);
    const cr=el("div","row"); cr.style.marginTop="8px"; const cb=el("button","btn small",T(S.copyPlain)); cb.type="button"; const cm=el("span","fine"); copyTo(cb,cm,()=>txt,pre); cr.append(cb,cm); ds.append(cr);
    out.append(ds);
  }
  drawOut();
  grid.append(form,out); wrap.append(grid); app.append(wrap);
}

const FAQ = [
  {id:"who-pays", q:{zh:"CBAM 的钱是我交吗？",en:"Do I pay CBAM?"}, a:{zh:"不是。欧盟 CBAM 由欧盟进口商申报并购买证书。但进口商需要你的实际排放数据，拿不到就按欧盟默认值计算。默认值偏高，多出来的成本通常会通过压价转回给你。",en:"No. The EU importer declares and buys certificates. But the importer needs your actual emissions; without them EU default values apply, which run high, and the extra cost usually comes back as price pressure."}, s:["cbam"]},
  {id:"fifty-t", q:{zh:"50 吨豁免门槛怎么算？",en:"How does the 50-tonne exemption work?"}, a:{zh:"按每个欧盟进口商一年进口的全部 CBAM 商品总质量算，不是只看你这一家供应商。客户从你这里买 20 吨，但从别家也买，总量超过 50 吨就仍然要申报。",en:"It counts each EU importer's total CBAM imports for the year, not just from you. If a buyer takes 20 t from you and more from others, they must still declare once the total passes 50 t."}, s:["cbam25"]},
  {id:"in-scope", q:{zh:"怎么知道我的产品在不在 CBAM 范围？",en:"Is my product covered by CBAM?"}, a:{zh:"看海关编码是否列在 CBAM 条例附件一。钢铁：72 章（部分铁合金除外）、7301–7311、7318、7326；铝：7601、7603–7614、7616；还有水泥、化肥、氢和电力。7323 钢制厨具、7615 铝制厨具不在范围内。",en:"Check whether the HS code is in Annex I. Steel: chapter 72 (some ferro-alloys excluded), 7301–7311, 7318, 7326; aluminium: 7601, 7603–7614, 7616; plus cement, fertiliser, hydrogen and electricity. 7323 steel kitchenware and 7615 aluminium kitchenware are out."}, s:["cbam"]},
  {id:"questionnaire", q:{zh:"客户的 ESG 问卷必须每题都答吗？",en:"Must I answer every question in a buyer's ESG questionnaire?"}, a:{zh:"按欧盟 Omnibus I 指令，员工不超过 1000 人的供应商可以拒绝提供超出自愿标准（VSME）的信息。实务上建议先答能源、排放、环保政策三类基础题，其余写明正在准备，并问清楚哪些是必答。",en:"Under Omnibus I, suppliers with up to 1,000 staff may decline requests beyond the voluntary standard (VSME). In practice, answer energy, emissions and policy first, mark the rest in progress, and ask which are mandatory."}, s:["omni","vsme"]},
  {id:"electricity", q:{zh:"电费单怎么变成碳排放？",en:"How do power bills become carbon emissions?"}, a:{zh:"用电量（千瓦时）乘以电网排放因子。中国官方最新的全国平均值是 2023 年的 0.5306 kgCO₂/kWh，由生态环境部和国家统计局发布。结果就是范围 2 排放，可以直接用碳数据计算器算。",en:"Multiply kWh by the grid factor. China's latest official national average is 0.5306 kgCO₂/kWh (2023, MEE and NBS). The result is Scope 2; the carbon calculator does it for you."}, s:["mee","ghg"]},
  {id:"scope-123", q:{zh:"范围 1、范围 2、范围 3 有什么区别？",en:"What are Scopes 1, 2 and 3?"}, a:{zh:"这是 GHG Protocol 的分类。范围 1：工厂自己烧燃料的直接排放；范围 2：外购电力和热力的排放；范围 3：供应链上下游的其他排放。你的范围 1 和 2，就是你客户的范围 3，所以客户会找你要。",en:"GHG Protocol categories. Scope 1: fuel you burn; Scope 2: purchased power and heat; Scope 3: everything else in the value chain. Your Scopes 1 and 2 are your buyer's Scope 3, which is why they ask you."}, s:["ghg","gri305"]},
  {id:"verify", q:{zh:"碳数据需要第三方核查吗？",en:"Does carbon data need third-party verification?"}, a:{zh:"回答一般的客户问卷通常不强制。但用于 CBAM 申报的实际排放需要经认可的核查机构核查，英国 CBAM 也明确要求实际数据经核查才能替代默认值。",en:"Usually not for ordinary questionnaires. Actual emissions used in CBAM declarations must be verified by an accredited verifier, and the UK CBAM also requires verified data to replace defaults."}, s:["cbam","ukcbam","iso14064"]},
  {id:"audits", q:{zh:"SMETA 和 BSCI 有什么区别？要做哪个？",en:"SMETA or BSCI — which one?"}, a:{zh:"两者都是社会责任审核，不是法律。SMETA 由 Sedex 管理，分 2 支柱和 4 支柱；BSCI 由 amfori 管理，按它的行为准则审核。做哪个取决于你的客户用哪个平台，先问清楚再预约，避免重复审核。",en:"Both are social audits, not laws. SMETA (Sedex) comes in 2- or 4-pillar; BSCI (amfori) follows its Code of Conduct. Which you need depends on your buyer's platform, so ask first to avoid duplicate audits."}, s:["smeta","bsci"]},
  {id:"eudr", q:{zh:"EUDR 对我意味着什么？",en:"What does EUDR mean for me?"}, a:{zh:"如果产品含木材、天然橡胶、牛皮革、可可、咖啡、大豆或棕榈油，欧盟进口商要提交尽职调查声明，证明原料不来自 2020 年底以后毁林的土地，并提供产地地块坐标。大中型进口商 2026 年 12 月 30 日起适用。",en:"If your products contain wood, natural rubber, cattle leather, cocoa, coffee, soy or palm oil, EU importers must file a due-diligence statement proving no deforestation after 2020, with plot coordinates. Applies to most importers from 30 Dec 2026."}, s:["eudr","eudr25"]},
  {id:"not-covered", q:{zh:"我的行业不在 CBAM 和 EUDR 里，是不是就不用管？",en:"My industry isn't in CBAM or EUDR — am I fine?"}, a:{zh:"不一定。包装法规 PPWR 几乎覆盖所有带包装的出口货物，REACH 和 RoHS 管化学品和电子产品，大品牌还会通过问卷和审核向你要数据。直接约束少，不等于没有要求。",en:"Not necessarily. PPWR covers almost all packaged goods, REACH and RoHS cover chemicals and electronics, and large brands still request data through questionnaires and audits."}, s:["ppwr","reach","rohs"]},
  {id:"us", q:{zh:"美国客户也会要碳数据吗？",en:"Will US buyers ask for carbon data?"}, a:{zh:"美国没有联邦层面的进口碳税。但加州 SB 253 要求在当地经营、年营收超 10 亿美元的公司披露排放，供应链排放（范围 3）计划 2027 年起，所以美国大品牌可能会问。",en:"There is no federal import carbon tax. California SB 253 requires companies with over $1bn revenue doing business there to disclose emissions, with Scope 3 planned from 2027, so large US brands may ask."}, s:["sb253"]},
  {id:"iso", q:{zh:"没有 ISO 14001 会被停单吗？",en:"Will I lose orders without ISO 14001?"}, a:{zh:"ISO 14001 不是法律要求，通常不会单独导致停单，但会影响 EcoVadis 等评级分数。暂时没有证书，可以先写一页环保制度（废水、废气、固废怎么处理）回答问卷。",en:"ISO 14001 isn't a legal requirement and rarely stops orders on its own, but it affects ratings like EcoVadis. Without it, a one-page environmental policy can answer the questionnaire for now."}, s:["iso14001","gri2"]}
];

function timelineEl(filterInd, limit){
  const today = new Date().toISOString().slice(0,10);
  const items = TIMELINE.filter(x=>!filterInd || x.p.includes("*") || x.p.includes(filterInd));
  const upcoming = items.filter(x=>x.d>=today), past = items.filter(x=>x.d<today);
  const show = past.slice(-1).concat(upcoming).slice(0, limit||99);
  const wrap = el("ol","tl");
  show.forEach(x=>{
    const r = RULE[x.r]; const li = el("li", x.d<today?"past":"");
    const dd = el("div","tl-d"); dd.append(el("b",null,x.d.slice(0,7).replace("-",".")), el("span",null, x.d<today ? T(S.tlDone) : T(S.tlIn)(Math.ceil((new Date(x.d)-new Date(today))/86400000))));
    const body = el("div","tl-b"); const a=link("#rule-"+x.r,"tl-t",T(x.t)); body.append(a);
    const meta=el("div","tl-m"); meta.append(statusTag(r.status), el("span","fine",T(MARKET[r.mkt]))); body.append(meta);
    li.append(dd, body); wrap.append(li);
  });
  return wrap;
}

  const s3 = el("section","dsec"); s3.append(el("h2",null,T(S.gDocs)), el("p","fine",T(S.gDocsP)));
  let done={}; try{ done=JSON.parse(localStorage.getItem("gl-docs-"+id)||"{}"); }catch(e){}
  const cl = el("div","checklist");

  const prog = el("div","fine",T(S.gProg)(Object.values(done).filter(Boolean).length, T(x.docs).length));
  s3.append(cl, prog); main.append(s3);
  const s4 = el("section","dsec"); s4.append(el("h2",null,T(S.gSteps))); const ol=el("ol","todo"); T(x.steps).forEach(t=>{ const li=el("li"); li.append(el("p",null,t)); ol.append(li); }); s4.append(ol); main.append(s4);
  const s5 = el("div","why"); s5.append(el("span","why-h",T(S.gMyth)), el("p",null,T(x.myth))); s5.querySelector("p").style.margin="4px 0 0"; main.append(s5);
  const s6 = el("section","dsec"); s6.style.marginTop="28px"; s6.append(el("h2",null,T(S.gFaq))); x.faq.forEach(fid=>s6.append(faqItem(FAQ_BY[fid],false))); main.append(s6);
  const aside = el("aside","aside");
  aside.append(el("h3",null,T(S.gNext)));
  const go = el("button","btn solid",T(S.gCheck)); go.type="button";

  aside.append(el("p","fine",T(S.gCheckP)), go, link("#calc","textlink",T(S.gCalc)));
  aside.append(el("h3",null,T(S.gDates)), timelineEl(id, 5));

/* ============ router ============ */
function route(){
  const h = (location.hash||"").replace(/^#/,"");
  if(h.startsWith("rule-")) return ["rule",h.slice(5)];
  if(h.startsWith("guide-")) return ["guide",h.slice(6)];
  if(["check","report","rules","decoder","method","join","sample","about","calc","guides","faq","suppliers"].includes(h)) return [h];
  return ["home"];
}
let lastView = null;
const PAGE_T = {report:"repTitle", check:"navStart", rules:"navRules", decoder:"navDec", method:"navMethod", join:"navJoin", about:"navAbout", calc:"navCalc", guides:"navGuides", faq:"navFaq", suppliers:"navSuppliers"};
function setMeta(v,arg){
  const brand = lang==="en" ? "Qingdan" : "青单 Qingdan";
  let title = null, desc = T(S.metaDesc);
  if(v==="guide" && IND_BY[arg]){ title = indName(arg)+(lang==="en"?" export compliance guide":" 出口合规指南"); desc = T(IND_BY[arg].one); }
  else if(v==="rule" && RULE[arg]){ title = T(RULE[arg].t); }
  else if(v==="sample"){ title = lang==="en"?"Sample order risk checklist":"样例订单风险检查单"; }
  else if(PAGE_T[v]){ title = T(S[PAGE_T[v]]); }
  document.title = title ? title+" · "+brand : brand+(lang==="en"?" · Green compliance for export factories":" · 中小出口工厂的买家合规助手");
  const md = document.querySelector('meta[name="description"]'); if(md) md.setAttribute("content", desc);
}
function render(){
  const [v,arg] = route();
  document.documentElement.lang = lang==="en"?"en":"zh-CN";
  document.querySelectorAll("[data-i]").forEach(n=>{ const k=n.getAttribute("data-i"); const val=T(S[k]); if(typeof val==="string") n.textContent=val; });
  document.getElementById("lang-zh").setAttribute("aria-pressed",String(lang==="zh"));
  document.getElementById("lang-en").setAttribute("aria-pressed",String(lang==="en"));
  const navKey = v==="rule"?"rules":v==="guide"?"guides":v;
  document.querySelectorAll("[data-nav]").forEach(a=>{ if(a.getAttribute("data-nav")===navKey) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  app.innerHTML="";
  ({home:viewHome,suppliers:viewSuppliers,check:viewCheck,report:()=>viewReport(),sample:viewSample,about:viewAbout,calc:viewCalc,guides:viewGuides,guide:()=>viewGuide(arg),faq:viewFAQ,rules:viewRules,rule:()=>viewRule(arg),decoder:viewDecoder,method:viewMethod,join:viewJoin})[v]();
  setMeta(v,arg);
  const key = v+(arg||"")+(v==="check"?qIndex:"");
  if(key!==lastView) window.scrollTo(0,0);
  lastView = key;
}
window.addEventListener("hashchange",()=>{
  const rv=route()[0];
  // Coming back to the check from elsewhere: resume where the saved draft stopped, unless a view asked to keep the index.
  if(rv==="check" && lastView && !lastView.startsWith("check") && !keepIdx) qIndex = reportReady ? 0 : firstUnanswered(answers);
  keepIdx=false;
  document.getElementById("links").classList.remove("open");
  document.getElementById("menu-btn").setAttribute("aria-expanded","false");
  render();
});
document.getElementById("menu-btn").addEventListener("click",e=>{ const l=document.getElementById("links"); const o=l.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded",String(o)); });
/* Printing: <details> content is hidden when closed, so open everything before the print dialog. */
let printWasClosed=[];
window.addEventListener("beforeprint",()=>{ printWasClosed=[...document.querySelectorAll("details:not([open])")]; printWasClosed.forEach(d=>{d.open=true;}); });
window.addEventListener("afterprint",()=>{ printWasClosed.forEach(d=>{d.open=false;}); printWasClosed=[]; });
function setLang(x){ lang=x; try{localStorage.setItem("gl-lang",x);}catch(e){} lastView="__"; const y=window.scrollY; render(); window.scrollTo(0,y); }
document.getElementById("lang-zh").addEventListener("click",()=>setLang("zh"));
document.getElementById("lang-en").addEventListener("click",()=>setLang("en"));
restoreDraft();
render();
})();
</script>
